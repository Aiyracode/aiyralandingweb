<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Ilustración de un almacén interior en nave industrial con racks selectivos, pallets y una autoelevadora">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF5FB"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1177C7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="520" fill="url(#sky2)"/>
  <rect width="1000" height="520" fill="url(#grid2)"/>

  <!-- nave building shell -->
  <polygon points="90,150 500,70 910,150" fill="none" stroke="#3E5468" stroke-width="6" stroke-linejoin="round"/>
  <line x1="90" y1="150" x2="90" y2="470" stroke="#3E5468" stroke-width="6"/>
  <line x1="910" y1="150" x2="910" y2="470" stroke="#3E5468" stroke-width="6"/>
  <!-- roof truss hint -->
  <g stroke="#9FB6C8" stroke-width="3" stroke-opacity="0.8">
    <line x1="120" y1="146" x2="500" y2="90"/>
    <line x1="880" y1="146" x2="500" y2="90"/>
    <line x1="300" y1="118" x2="300" y2="150"/>
    <line x1="700" y1="118" x2="700" y2="150"/>
  </g>

  <!-- ground -->
  <line x1="90" y1="470" x2="910" y2="470" stroke="#0E2233" stroke-width="3"/>

  <!-- rack block A -->
  <g stroke="#2E6DA8" stroke-width="8">
    <line x1="200" y1="230" x2="200" y2="460"/>
    <line x1="340" y1="230" x2="340" y2="460"/>
    <line x1="440" y1="230" x2="440" y2="460"/>
  </g>
  <g stroke="#9FB6C8" stroke-width="6">
    <line x1="200" y1="290" x2="440" y2="290"/>
    <line x1="200" y1="350" x2="440" y2="350"/>
    <line x1="200" y1="410" x2="440" y2="410"/>
  </g>
  <g fill="#F4570A">
    <rect x="215" y="258" width="100" height="28" rx="3"/>
    <rect x="355" y="258" width="70" height="28" rx="3"/>
    <rect x="215" y="318" width="100" height="28" rx="3"/>
    <rect x="215" y="378" width="100" height="28" rx="3"/>
    <rect x="355" y="378" width="70" height="28" rx="3"/>
  </g>

  <!-- rack block B -->
  <g stroke="#2E6DA8" stroke-width="8">
    <line x1="560" y1="230" x2="560" y2="460"/>
    <line x1="700" y1="230" x2="700" y2="460"/>
    <line x1="800" y1="230" x2="800" y2="460"/>
  </g>
  <g stroke="#9FB6C8" stroke-width="6">
    <line x1="560" y1="290" x2="800" y2="290"/>
    <line x1="560" y1="350" x2="800" y2="350"/>
    <line x1="560" y1="410" x2="800" y2="410"/>
  </g>
  <g fill="#F4570A">
    <rect x="575" y="258" width="100" height="28" rx="3"/>
    <rect x="715" y="258" width="70" height="28" rx="3"/>
    <rect x="575" y="318" width="100" height="28" rx="3"/>
    <rect x="715" y="318" width="70" height="28" rx="3"/>
    <rect x="575" y="378" width="100" height="28" rx="3"/>
  </g>

  <!-- forklift in the aisle -->
  <g>
    <rect x="470" y="415" width="70" height="40" rx="5" fill="#0E2233"/>
    <rect x="500" y="395" width="30" height="22" rx="3" fill="#0E2233"/>
    <line x1="470" y1="400" x2="470" y2="458" stroke="#F4570A" stroke-width="5"/>
    <rect x="452" y="440" width="20" height="8" fill="#F4570A"/>
    <circle cx="485" cy="460" r="12" fill="#3E5468"/>
    <circle cx="525" cy="460" r="12" fill="#3E5468"/>
  </g>
</svg>
